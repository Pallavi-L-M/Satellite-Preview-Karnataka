services:
  - type: web
    name: satellite-preview-karnataka
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    branch: main
    repo: https://github.com/Pallavi-L-M/Satellite-Preview-Karnataka.git
